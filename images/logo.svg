<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="Andrew Ayad monogram">
  <defs>
    <linearGradient id="legLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade9b"/>
      <stop offset="100%" stop-color="#2b8f61"/>
    </linearGradient>
    <linearGradient id="legRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c99b70"/>
      <stop offset="100%" stop-color="#8a6543"/>
    </linearGradient>
  </defs>

  <!-- Hexagon: architecture -->
  <path fill="none" stroke="#2b4837" stroke-width="2" stroke-linejoin="round"
        d="M 60 5 L 110 33 L 110 87 L 60 115 L 10 87 L 10 33 Z" />
  <path fill="none" stroke="#4ade9b" stroke-width="3" stroke-linecap="round" d="M 60 5 L 110 33" />
  <path fill="none" stroke="#c99b70" stroke-width="3" stroke-linecap="round" d="M 10 87 L 60 115" />

  <!-- Abstract 'A' -->
  <polygon fill="url(#legLeft)" points="60,25 45,25 25,85 40,85" />
  <polygon fill="url(#legRight)" opacity="0.9" points="60,25 75,25 95,85 80,85" />
  <!-- Wood tone, not white: this file is loaded via <img> so it cannot inherit
       currentColor, and it must stay legible on both the dark and light bg. -->
  <rect x="35" y="55" width="50" height="8" rx="2" fill="#c99b70" />
  <circle cx="60" cy="15" r="4" fill="#4ade9b" />
</svg>
